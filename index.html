<div id="toast"></div>


<script type="module">

  /*
   * ============================================================
   * CAT TIMES
   * Supabase configuration
   * ============================================================
   */

  const SUPABASE_URL =
    "https://bwbbnljshggcwklktfum.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_34wdfJsFMKCpx846e7jtCA_sfNQJQs1";


  /*
   * Load Supabase JS
   */

  import {
    createClient
  } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


  const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


  /*
   * State
   */

  let currentUser = null;
  let posts = [];
  let currentSort = "latest";
  let currentCategory = "all";
  let currentSearch = "";
  let openComments = new Set();


  /*
   * DOM
   */

  const postsEl = document.getElementById("posts");
  const postCountEl = document.getElementById("postCount");
  const searchEl = document.getElementById("search");
  const categoryFilterEl = document.getElementById("categoryFilter");
  const postModal = document.getElementById("postModal");
  const reportModal = document.getElementById("reportModal");
  const postForm = document.getElementById("postForm");
  const reportForm = document.getElementById("reportForm");
  const contentEl = document.getElementById("postContent");
  const charCountEl = document.getElementById("charCount");


  /*
   * Date
   */

  document.getElementById("today").textContent =
    new Date().toLocaleDateString("zh-CN", {
      year: "numeric",
      month: "long",
      day: "numeric"
    });


  /*
   * Toast
   */

  let toastTimer;

  function toast(message) {
    const el = document.getElementById("toast");

    el.textContent = message;
    el.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
      el.classList.remove("show");
    }, 2600);
  }


  /*
   * Anonymous login
   */

  async function ensureAuth() {

    const {
      data: sessionData
    } = await supabase.auth.getSession();

    if (sessionData.session) {
      currentUser = sessionData.session.user;
      return currentUser;
    }

    const {
      data,
      error
    } = await supabase.auth.signInAnonymously();

    if (error) {
      console.error(error);

      toast(
        "匿名登录失败：请先在 Supabase 开启 Anonymous Sign-Ins"
      );

      throw error;
    }

    currentUser = data.user;

    return currentUser;
  }


  /*
   * Load posts
   */

  async function loadPosts() {

    postsEl.innerHTML = `
      <div class="state">
        <div class="cat">🐱</div>
        <strong>猫猫正在翻阅今天的校园报纸……</strong>
      </div>
    `;

    let query = supabase
      .from("posts")
      .select(`
        id,
        author_id,
        created_at,
        nickname,
        title,
        category,
        content,
        status,
        like_count
      `)
      .eq("status", "published");

    if (currentCategory !== "all") {
      query = query.eq("category", currentCategory);
    }

    if (currentSort === "hot") {

      query = query
        .order("like_count", {
          ascending: false
        })
        .order("created_at", {
          ascending: false
        });

    } else {

      query = query.order(
        "created_at",
        {
          ascending: false
        }
      );

    }

    const {
      data,
      error
    } = await query.limit(100);

    if (error) {
      console.error(error);

      postsEl.innerHTML = `
        <div class="state">
          <div class="cat">🙀</div>
          <strong>数据库连接失败</strong>
          <p>${escapeHTML(error.message)}</p>
        </div>
      `;

      return;
    }

    posts = data || [];

    renderPosts();
  }


  /*
   * Render
   */

  function renderPosts() {

    const keyword =
      currentSearch.trim().toLowerCase();

    let filtered = posts.filter(post => {

      if (!keyword) return true;

      return (
        (post.title || "")
          .toLowerCase()
          .includes(keyword)
        ||
        (post.content || "")
          .toLowerCase()
          .includes(keyword)
      );

    });


    postCountEl.textContent =
      `${filtered.length} 篇`;


    if (currentSort === "hot") {
      document.getElementById("feedTitle").textContent =
        "热门吐槽";
    } else {
      document.getElementById("feedTitle").textContent =
        "最新吐槽";
    }


    if (!filtered.length) {

      postsEl.innerHTML = `
        <div class="state">
          <div class="cat">🐈</div>
          <strong>这里暂时没有猫猫找到的内容。</strong>
          <p>成为第一个发帖的人吧。</p>
        </div>
      `;

      return;
    }


    postsEl.innerHTML = "";

    filtered.forEach(post => {
      postsEl.appendChild(createPostElement(post));
    });

  }


  /*
   * Create post
   */

  function createPostElement(post) {

    const article = document.createElement("article");

    article.className = "post";

    const date = new Date(
      post.created_at
    ).toLocaleString(
      "zh-CN",
      {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }
    );


    const nickname =
      post.nickname?.trim() ||
      "匿名猫猫";


    article.innerHTML = `
      <div class="post-meta">
        <span class="category">
          ${escapeHTML(post.category || "其他")}
        </span>

        <span>
          ${escapeHTML(nickname)}
        </span>

        <span>·</span>

        <span>
          ${escapeHTML(date)}
        </span>
      </div>

      <h3>
        ${escapeHTML(post.title)}
      </h3>

      <div class="post-content">
        ${escapeHTML(post.content)}
      </div>

      <div class="post-footer">

        <button class="action like-btn">
          ♡ 赞
          <span class="like-number">
            ${Number(post.like_count || 0)}
          </span>
        </button>

        <button class="action comment-btn">
          💬 评论
        </button>

        <button class="action report-btn">
          ⚑ 举报
        </button>

      </div>

      <div class="comments">

        <div class="comment-list">
          <div style="color:#777;font-size:13px">
            加载评论中……
          </div>
        </div>

        <form class="comment-form">

          <input
            maxlength="30"
            placeholder="昵称"
          >

          <textarea
            maxlength="1000"
            placeholder="写下你的评论……"
            required
          ></textarea>

          <button
            class="action"
            type="submit"
          >
            发送
          </button>

        </form>

      </div>
    `;


    const likeBtn =
      article.querySelector(".like-btn");

    const commentBtn =
      article.querySelector(".comment-btn");

    const reportBtn =
      article.querySelector(".report-btn");

    const commentsEl =
      article.querySelector(".comments");

    const commentList =
      article.querySelector(".comment-list");

    const commentForm =
      article.querySelector(".comment-form");


    /*
     * Like
     */

    likeBtn.addEventListener(
      "click",
      async () => {

        await toggleLike(
          post,
          likeBtn
        );

      }
    );


    /*
     * Comments
     */

    commentBtn.addEventListener(
      "click",
      async () => {

        const opening =
          !commentsEl.classList.contains("open");

        commentsEl.classList.toggle("open");

        if (opening) {

          openComments.add(post.id);

          await loadComments(
            post.id,
            commentList
          );

        } else {

          openComments.delete(post.id);

        }

      }
    );


    /*
     * Report
     */

    reportBtn.addEventListener(
      "click",
      () => {

        document.getElementById(
          "reportPostId"
        ).value = post.id;

        reportModal.classList.add("open");

      }
    );


    /*
     * Comment submit
     */

    commentForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        const inputs =
          commentForm.querySelectorAll(
            "input, textarea"
          );

        const nickname =
          inputs[0].value.trim();

        const content =
          inputs[1].value.trim();


        if (!content) {
          toast("评论不能为空");
          return;
        }


        if (content.length > 1000) {
          toast("评论不能超过 1000 字");
          return;
        }


        const user =
          await ensureAuth();


        const button =
          commentForm.querySelector("button");

        button.disabled = true;
        button.textContent = "发送中……";


        const {
          error
        } = await supabase
          .from("comments")
          .insert({
            author_id: user.id,
            post_id: post.id,
            nickname:
              nickname || "匿名猫猫",
            content,
            status: "published"
          });


        button.disabled = false;
        button.textContent = "发送";


        if (error) {

          console.error(error);

          toast(
            "评论失败：" + error.message
          );

          return;
        }


        inputs[1].value = "";

        toast("评论已发布");

        await loadComments(
          post.id,
          commentList
        );

      }
    );


    /*
     * Restore open state
     */

    if (openComments.has(post.id)) {

      commentsEl.classList.add("open");

      setTimeout(() => {
        loadComments(
          post.id,
          commentList
        );
      }, 0);

    }


    return article;
  }


  /*
   * Like toggle
   */

  async function toggleLike(post, button) {

    const user =
      await ensureAuth();


    const {
      data: existing,
      error: findError
    } = await supabase
      .from("reactions")
      .select("id")
      .eq("post_id", post.id)
      .eq("visitor_id", user.id)
      .eq("type", "like")
      .maybeSingle();


    if (findError) {

      toast(
        "无法读取点赞状态"
      );

      console.error(findError);

      return;
    }


    if (existing) {

      const {
        error
      } = await supabase
        .from("reactions")
        .delete()
        .eq("id", existing.id);


      if (error) {

        toast("取消点赞失败");

        return;
      }

      button.classList.remove("liked");

    } else {

      const {
        error
      } = await supabase
        .from("reactions")
        .insert({
          post_id: post.id,
          visitor_id: user.id,
          type: "like"
        });


      if (error) {

        toast(
          "点赞失败：" + error.message
        );

        return;
      }

      button.classList.add("liked");

    }


    /*
     * Count reactions directly.
     */

    const {
      count,
      error: countError
    } = await supabase
      .from("reactions")
      .select("*", {
        count: "exact",
        head: true
      })
      .eq("post_id", post.id)
      .eq("type", "like");


    if (!countError) {

      button.querySelector(
        ".like-number"
      ).textContent = count || 0;

    }

  }


  /*
   * Load comments
   */

  async function loadComments(
    postId,
    container
  ) {

    const {
      data,
      error
    } = await supabase
      .from("comments")
      .select(`
        id,
        created_at,
        nickname,
        content
      `)
      .eq("post_id", postId)
      .eq("status", "published")
      .order(
        "created_at",
        {
          ascending: true
        }
      );


    if (error) {

      container.innerHTML = `
        <div style="color:#b00020">
          评论加载失败
        </div>
      `;

      return;
    }


    if (!data?.length) {

      container.innerHTML = `
        <div style="color:#777;font-size:13px">
          还没有评论。
        </div>
      `;

      return;
    }


    container.innerHTML = "";


    data.forEach(comment => {

      const div =
        document.createElement("div");

      div.className = "comment";

      div.innerHTML = `
        <div class="comment-name">
          ${escapeHTML(
            comment.nickname || "匿名猫猫"
          )}
        </div>

        <div class="comment-body">
          ${escapeHTML(comment.content)}
        </div>
      `;

      container.appendChild(div);

    });

  }


  /*
   * Escape HTML
   */

  function escapeHTML(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  /*
   * Modal
   */

  document
    .getElementById("newPostBtn")
    .addEventListener(
      "click",
      () => {

        postModal.classList.add("open");

        setTimeout(() => {
          document
            .getElementById("postTitle")
            .focus();
        }, 100);

      }
    );


  document
    .getElementById("closeModal")
    .addEventListener(
      "click",
      () => {
        postModal.classList.remove("open");
      }
    );


  document
    .getElementById("closeReport")
    .addEventListener(
      "click",
      () => {
        reportModal.classList.remove("open");
      }
    );


  postModal.addEventListener(
    "click",
    event => {

      if (
        event.target === postModal
      ) {
        postModal.classList.remove("open");
      }

    }
  );


  reportModal.addEventListener(
    "click",
    event => {

      if (
        event.target === reportModal
      ) {
        reportModal.classList.remove("open");
      }

    }
  );


  /*
   * Character counter
   */

  contentEl.addEventListener(
    "input",
    () => {

      charCountEl.textContent =
        `${contentEl.value.length} / 5000`;

    }
  );


  /*
   * Post submit
   */

  postForm.addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const nickname =
        document
          .getElementById("nickname")
          .value
          .trim();


      const category =
        document
          .getElementById("postCategory")
          .value;


      const title =
        document
          .getElementById("postTitle")
          .value
          .trim();


      const content =
        document
          .getElementById("postContent")
          .value
          .trim();


      if (!title) {
        toast("请填写标题");
        return;
      }


      if (!content) {
        toast("请填写内容");
        return;
      }


      if (title.length > 120) {
        toast("标题不能超过 120 字");
        return;
      }


      if (content.length > 5000) {
        toast("内容不能超过 5000 字");
        return;
      }


      /*
       * Very basic client-side anti-spam.
       */

      const lastPost =
        Number(
          localStorage.getItem(
            "cat_times_last_post"
          ) || 0
        );


      if (
        Date.now() - lastPost <
        15000
      ) {

        toast(
          "发帖太快了，请稍等 15 秒"
        );

        return;
      }


      const user =
        await ensureAuth();


      const button =
        document.getElementById(
          "submitPost"
        );


      button.disabled = true;
      button.textContent = "发布中……";


      const {
        error
      } = await supabase
        .from("posts")
        .insert({
          author_id: user.id,
          nickname:
            nickname || "匿名猫猫",
          title,
          category,
          content,
          status: "published"
        });


      button.disabled = false;
      button.textContent = "发布";


      if (error) {

        console.error(error);

        toast(
          "发布失败：" + error.message
        );

        return;
      }


      localStorage.setItem(
        "cat_times_last_post",
        String(Date.now())
      );


      postForm.reset();

      charCountEl.textContent =
        "0 / 5000";

      postModal.classList.remove("open");

      toast("发布成功 🐱");

      currentSort = "latest";

      await loadPosts();

    }
  );


  /*
   * Report submit
   */

  reportForm.addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const user =
        await ensureAuth();


      const postId =
        document
          .getElementById(
            "reportPostId"
          )
          .value;


      const reason =
        document
          .getElementById(
            "reportReason"
          )
          .value;


      const {
        error
      } = await supabase
        .from("reports")
        .insert({
          post_id: Number(postId),
          reporter_id: user.id,
          reason
        });


      if (error) {

        console.error(error);

        toast(
          "举报失败：" + error.message
        );

        return;
      }


      reportModal.classList.remove("open");

      toast(
        "举报已提交，感谢你的反馈。"
      );

    }
  );


  /*
   * Search
   */

  searchEl.addEventListener(
    "input",
    event => {

      currentSearch =
        event.target.value;

      renderPosts();

    }
  );


  /*
   * Category select
   */

  categoryFilterEl.addEventListener(
    "change",
    event => {

      currentCategory =
        event.target.value;

      loadPosts();

    }
  );


  /*
   * Navigation
   */

  document
    .querySelectorAll("nav button")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              "nav button"
            )
            .forEach(btn =>
              btn.classList.remove(
                "active"
              )
            );

          button.classList.add(
            "active"
          );


          if (
            button.dataset.sort
          ) {

            currentSort =
              button.dataset.sort;

            loadPosts();

          }


          if (
            button.dataset.category
          ) {

            currentCategory =
              button.dataset.category;

            categoryFilterEl.value =
              currentCategory;

            loadPosts();

          }

        }
      );

    });


  /*
   * Start
   */

  async function init() {

    try {

      await ensureAuth();

      await loadPosts();

    } catch (error) {

      console.error(error);

    }

  }


  init();

</script>

</body>
</html>
